<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>17. string 내장 함수</title>
    </head>

    <body>
        <script>
            //1. property : length
            let str = "Hello World!!";
            console.log(str.length);

            str = "Welcome Seoul";

            //2. indexOf(); - 찾고자 하는 문자열의 **첫 인덱스** 반환
            console.log(str.indexOf("Seoul")); // 8
            console.log(str.indexOf("Jeju")); // -1 반환

            // indexOf(찾고자 하는 문자열, 검색 시작 위치)
            console.log(str.indexOf("l", 7));

            //활용 예 : 전화번호 입력 시 -없이 입력한다고 가정하자.
            let tel = "010-0000-1111";
            if (tel.indexOf("-") != -1) {
                console.log("'-'없이 입력해주세요");
            }

            // 3. lastIndexOf() : 뒤에서 부터 문자열을 찾아 첫 인덱스 반환
            str = "Welcome Seoul";
            console.log(str.lastIndexOf("l"));

            // 4. slice(시작 위치, 종료위치) : 문자열을 종료 위치-1까지 잘라내기 **(중)
            // 종료위치 생략 -> 끝까지,  시작과 종료에 음수가 올 수 있다.
            // 접근 방식이 유연하다.

            console.log(str.slice(8)); // 종료 위치 생략 시 끝까지.
            console.log(str.slice(-5)); // '-'는 뒤에서부터의 순서를 나타낸다.
            console.log(str.slice(-5, -2)); // Seo

            // 5. substring(시작위치, 종료위치) : 문자열을 시작위치부터 종료위치-1까지 잘라내기
            console.log(str.substring(8)); // Seoul
            console.log(str.substring(-5)); // Welcome Seoul = str.substring(0)
            console.log(str.substring(-5, -2)); // 오동작

            //6. substr(시작위치, 잘라낼 길이) : 문자열을 길이만큼 잘라내기
            // 명확하게 길이를 알고 있을 경우 매우 유용
            let studentNumber = "2418";
            let grade = studentNumber.substr(0, 1); // 학년, 2
            let classn = studentNumber.substr(1, 1); // 반, 4
            let number = studentNumber.substr(2, 2); // 번호, 18

            /*
      slice vs substring vs substr
      sclice : 가장 유연하고 현대적인 메소드, 음수처리가 가능 - (ES6 이후 매우 추천)
      substring : slice와 유사하지만 인덱스가 음인 경우 처리가 다르다
      substr : 인덱스가 아닌 글자 수를 기주능로 하지만 현재 웹표준으로 권장하지 않는다.
    */

            // 7. reqlace(str1, str2) : 문자열1을 문자열2로 교체하는 함수
            str = "Welcome Jeju! Jeju";
            //str.replace("Jeju", "Seoul");

            str.replace("Jeju", "Seoul"); //str의 본질이 바뀌진 않음

            // replace를 이용해 Jeju를 모두 Seoul로 바꾸기
            let word = "Jeju";
            let changeword = "Seoul";
            while (str.indexOf(word) != -1) {
                str = str.replace(word, changeword);
            }
            console.log(str);

            // 8. **toUpperCase() : 대문자로 변환
            // 9. **toLowerCase() : 소문자로 변환
            // 예) db M20260423MIRIM => m2026mirim, M2025mirim
            // 제품번호 대문자, 데이터베이스 대문자 => 제품번호를 조회해보자.
            // 사용자는 다양하게 입력하게 되므로.. 입력된 내용을 대(소)문자로 변환하면 된다.
            // - 사용자입력에 따른 유효성 체크에 반드시 사용됨.

            str = "Welcome Jeju! Jeju";
            console.log(str.toUpperCase());
            console.log(str.toLowerCase());

            // 10. concat() : 문자열을 하나로 합치기, 합치려는 문자열의 갯수에 제한이 없다.
            let firstName = "Jane";
            let lastName = "Doe";
            let fullnName = firstName.concat(
                " ",
                lastName,
                " Miss, ",
                "반갑습니다. ",
            );
            console.log(fullnName);

            // 11. trim() : 문자열의 앞, 뒤 공백을 제거
            let name = "    2학년        4반";
            console.log(name.trim()); //중간은 안날림

            // 12. ********padStart(문자열 전체길이, 앞에 채울 문자열) :
            // - 특정 문자를 앞에 채운다. 현업에서 가장 많이 사용하고, 중요하다.
            // ES5부터 등장, 날짜 양식 - 04-23이지만 누군가가 4-23으로 입력 시 사용

            let today = new Date(); //오늘 날짜 생성

            let year = today.getFullYear();
            let month = today.getMonth();
            let day = today.getDate();
            month++;

            //월을 두자리로 표현!! 2025년 04월 23일
            let strMonth = month.toString();
            if (strMonth.length < 2) {
                strMonth = "0" + month;
            }
            // padStart를 활용하면?
            strMonth.padStart(2, "0");
            console.log(year + "년 " + month + "월 " + day + "일");

            // 13. padEnd(문자열 전체 길이, 뒤에 채울 문자열) : 실무에서 거의 사용할 가능성이 낮다.

            // 14. ***charAt(index) : 인덱스에 해당하는 문자 1개 반환
            str = "Welcome Jeju! Jeju";
            console.log(str.charAt(6));

            // 15. charCodeAt(index) : 인덱스에 맞는 유니코드 값을 반환
            console.log(str.charCodeAt(6));

            str = "가나다힣";
            console.log(str.charCodeAt(0));
            console.log(str.charCodeAt(3));

            // 16. **********split(구분자) : 파라미터로 전달받은 문자열을 기준으로 문자열을 쪼갠다.
            // - 반환값이 반드시 배열
            /*
              DB에 객체 전달 시 : 객체를 json으로 변환 후 전송!
              Person = {
                name : "홍길동",
                tel : 01043783444
              }
              을 JSON으로 바꿔야해요
              그러면 키와 값을 구분하고 해야겟죠.. 그걸 위해 자주 써요!
            */

            let emailsOfClient = "park@gmail.com, kimm@naver.com, lee@daum.net";
            let result = emailsOfClient.split(",");
            console.log(result);

            emailsOfClient = "park@gmail.com kimm@naver.com lee@daum.net";
            result = emailsOfClient.split(" ");
            console.log(result);

            /*
      17. startWith(문자열) : 파라미터로 시작하는 지 여부를 boolean값으로 반환
      
      url 주소로 적합한지 여부를 판단하는 함수 checkEmail
      - https://유무로 판단

      let url = "Mysite.com"
    
    */

            // let url = "Mysite.com";
            let url = "https://d";
            checkEmail(url);
            console.log(url.lastIndexOf("https://"));

            function checkEmail(url) {
                if (url.startWith("https://")) {
                    console.log("적합한 url입니다.");
                } else {
                    console.log("url이 적합하지 않습니다.");
                }
            }

            // 18. ***endWith() : 파라미터로 종료하는 지 여부를 boolean값으로 반환
        </script>
    </body>
</html>
