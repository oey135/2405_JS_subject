<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21-1. 실무 set</title>
</head>

<body>
    <script>
        /*
            - 실무에서 set을 가장 유용하게 사용하는 경우는 "데이터의 중복을 허용하지 않으면서
            특정데이터가 존재하는 지 빠른 속도로 찾아내야 하는 경우"

            - 대표적인 예시로는 '최근 본 상품 목록(중복제거)', 찜한 상품 실시간 활성화 여부 체크
        
        */

        const shoppingCart = new Set();

        const addToCart = (productId) => {
            shoppingCart.add(productId);
        };
        addToCart("화장품1");
        addToCart("화장품2");
        addToCart("셔츠1");
        addToCart("화장품1");
        addToCart("셔츠2");
        console.log("최근 장바구니에 담은 상품 목록", shoppingCart);

        // 찜한 상품
        const wishList = new Set();

        const toggleProduct = (productId) => {
            //set에 있으면 해제, 없으면 추가
            if (wishList.has(productId)) {
                wishList.delete(productId);
            } else {
                wishList.add(productId);
            }
        };

        toggleProduct("야구공1");
        toggleProduct("야구공2");
        toggleProduct("야구공1");
        toggleProduct("축구공1");

    </script>
</body>

</html>
