<body>
    <script>
        /*
        
        배열
        - 하나 이상의 데이터를 담을 수 있다.
        - 어떤 데이터도 담을 수 있다.
        - 어떤 데이터도 함께 담을 수 있다.
        - 배열을 선언하는 순간 브라우저 엔진에 의해 length 속성 만들어짐
        - length property
        
        */

        let nums = [1, 2, 3, 4];
        let str = ['a', 'b', 'c'];
        let mix = [1, 3.5, 'a', 'abdf', true, [2, 3, 4], { name: '권초현' }];
        console.log(nums);
        console.log(str);
        console.log(mix);



        // 1. property 속성
        let a = []; // length 속성 만들어짐! 다음 중 결과가 undefined가 아닌 것은?
        console.log(a);
        console.log(a.length);


        // 2. 배열에 접근 : 인덱스
        console.log(mix[4]);

        // 3. 순서가 정해져 있다. -> 삭제, 삽입이 용이하지 않다. (그래서 나온 게 LinkedList)

        // 4. 내장함수 pop(), push()
        console.log("============");

        console.log(mix.pop());
        console.log(mix);
        console.log(mix.pop());
        console.log(mix);
        mix.push({ name: '권초현' });
        console.log(mix);
        // *매개 변수(parameter) : 함수 실행에 필요한 전달 값!

        // 5. 활용 -> 객체와 함께 활용
