<body>

    <button onclick="doSearch2()">조회 1</button>

    <table class="drink">

    <table class="drink">
        <thead class="title2">
            <th>제품명</th>
            <th>카테고리</th>
            <th>가격</th>

    <script>
        /*
        Array : js에서 가장 많이 사용하는 객체
        주로 백엔드에서 가져온 데이터의 처리에 활용된다.
    */

        let brands = [
            "하이닉스",
            "삼성",
            "구글",
            "네이버",
            "애플",
            "카카오",
        ];

        // 1. toString() : 배열의 요소를 ','를 이용해 하나의 문자열로 합치기

        console.log(brands.toString()); // 하이닉스,삼성,구글,네이버,애플,카카오

        // ********** 2. join() : 파라미터로 전달된 문자를 이용해 하나의 문자열로 합치기

        console.log(brands.join("/")); // 하이닉스/삼성/구글/네이버/애플/카카오
        console.log(brands.join("*")); // 하이닉스*삼성*구글*네이버*애플*카카오
        console.log(brands); // 원형은 바뀌지 않음

        // join() 실무 활용 예제
        // db에서 데이터를 불러와 동적으로 테이블 크기를 만들어 화면에 뿌리기

        //가장 고전적인 방법 : += 사용
        const doSearch1 = () => {
            //1. 데이터 불러오기

            const drinklist = [
                { name: "오렌지", price: 1000 },
                { name: "파워에이드", price: 1200 },
                { name: "커피", price: 700 },
                { name: "보리음료", price: 1200 },
                { name: "코카콜라", price: 1800 },
            ];

            //2. 화면에 뿌리기

            let trTags = "";
            for (let drink of drinklist) {
                trTags += "<tr>";
                trTags += "<td>" + drink.name + "</td>";
                trTags += "<td>" + drink.price + "</td>";
                trTags += "</tr>";
            }
            console.log(trTags);

            document.getElementById("tbody").innerHTML = trTags;
        };

        const doSearch2 = () => {
            //1. 데이터 불러오기

            const drinklist = [
                { name: "오렌지", price: 1000 },
                { name: "파워에이드", price: 1200 },
                { name: "커피", price: 700 },
                { name: "보리음료", price: 1200 },
                { name: "코카콜라", price: 1800 },
            ];

            //2, push하기 (데이터 수 만큼 반복)

            let datalist = [];
            for (let data of drinklist) {
                datalist.push(
                    `<tr><td>${data.name}</td><td>${data.price}</td></tr>`,
                );
            }

            //3. join()
            let trTags = datalist.join("");

            //4. 랜더링해서 화면에 뿌리기
            document.getElementById("tbody").innerHTML = trTags;
        };

        // 3. pop() : 배열의 마지막 요소를 제거 ()

        brands = ["하이닉스", "삼성", "구글", "네이버", "애플", "카카오"];
        console.log(brands.pop());
        console.log(brands);

        // 4. push() : 배열의 마지막에 요소를 추가 + join()과 자주 사용
        console.log(brands.push("테슬라")); // length가 리턴
        console.log(brands);

        /* 
        
            5. shift() : 배열의 처음 요소를 제거 -> queue(fifo)

            - coast가 많이 발생 -> 브라우저 엔진이 내부적으로 작업
            - 서버 프로그램에서 많이 사용 => 요청을 배열에 쌓아두었다가
            이벤트 큐에 순서대로 정리된 목록에서 1번 요청, 2번 요청...하나씩 꺼내서 작업을 처리

        */

        console.log(brands.shift());
        console.log(brands[0]);

        // 6. unshift() : 배열의 처음에 요소를 추가

        // coast가 많이 말생 -> 브라우저 엔진이  내부적으로 작업 ->
        // 프론트엔드에서 많이 사용

        console.log(brands.unshift("아마존")); // length가 리턴
        console.log(brands);

        // 실무 활용
        // 음료를 데이터 베이스에서 가져와 동적으로 뿌린다고 가정하자

        const loadDrinkType = () => {
            const types = [
                { text: "커피", code: "coffee" },
                { text: "콜라", code: "coke" },
                { text: "주스", code: "juice" },
                { text: "이온음료", code: "ion" },
            ];
            types.unshift({ text: "전체", code: "all" });
            const tags = [];
            for (let type of types) {
                tags.push(
                    `<option value="${type.code}">${type.text}</option>`,
                );
            }
            return tags;
        };
        const selDrink = loadDrinkType();
        document.getElementById("selDrinkTypes").innerHTML =
            selDrink.join("");

        const loadDrinkType2 = (add) => {
            const types = [
                { text: "커피", code: "coffee" },
                { text: "콜라", code: "coke" },
                { text: "주스", code: "juice" },
                { text: "이온음료", code: "ion" },
            ];
            console.log(add);
            if (add) {
                console.log("요소 추가 실행");
                types.unshift(add);
            }

            const tags = [];
            for (let type of types) {
                tags.push(
                    `<option value="${type.code}">${type.text}</option>`,
                );
            }
            return tags;
        };

        const selDrink2 = loadDrinkType2(); // unshift할 내용이 있다면 매개변수로 전달
        document.getElementById("selDrinkTypes2").innerHTML =
            selDrink2.join("");

        /*
            7. splice(p1,p2,p3) : 배열의 특정 위치에 새로운 요소 추가하거나 기존 요소 삭제 가능
            
            p1 : 추가할 요소 인덱스 번호,
            p2 : 삭제할 요소 객수,
            p3: 추가할 요소 
        
        */

        brands = ["하이닉스", "삼성", "구글", "네이버", "애플", "카카오"];
        // 구글과 네이버 사이에 "쿠팡" 삽입하기
        // brands.splice(3,0,"쿠팡");
        // console.log(brands);

        //과제 : 로직으로 위치를 찾아서 "쿠팡"을 삽입해보기
        let index = brands.indexOf("구글");
        brands.splice(index + 1, 0, "쿠팡");

        brands.splice(1, 1); //삼성 삭제
        console.log(brands);

        // 8. concat() : 배열을 하나로 합치기
        let arr1 = ["권초현", "김민채", "김서연"];
        let arr2 = ["김동현", "김민찬", "김희성"];
        let arr4 = ["이예지", "이하준", "조현재"];

        let arr3 = arr1.concat(arr2, arr4);
        console.log(arr3);

        //array spread operator : 배열 전개 연산자
        let arr5 = [...arr1, ...arr2, ...arr4];
        console.log(arr5);

        // 9. slice(start, end) : end-1까지 잘라내기

        brands = ["하이닉스", "삼성", "구글", "네이버", "애플", "카카오"];

        console.log(brands.slice(1, 4));
        console.log(brands); // 원본은 변하지 않음

        /*
            10. ***** sort() : 정렬 *****

            - 원본 배열 바뀜
            - 기본적으로 문자열 오름차순 기준
            - 숫자는 지원?? -> 약간의 수정과 이해 필요 -> 별도의 알고리즘을 만들어서 사용
            - 브라우저 엔진(크롬 : Timsort지원)이 알고리즘을 갖고 있고, 이에 대한 이해만 필요

            sort((a,b) => { // 오름차순
                if(a>b) return 1; // 양수 : 두 값의 자리를 바꿔라
                else if(a<b) return -1; // 음수 : 자리를 바꾸지 않는다.
                else return 0; // 0 : 자리를 바꾸지 않는다.
            })
            
            sort((a,b) => { // 내림차순
                if(a<b) return 1; // 양수 : 두 값의 자리를 바꿔라
                else if(a>b) return -1; // 음수 : 자리를 바꾸지 않는다.
                else return 0; // 0 : 자리를 바꾸지 않는다.
            })
            
            - 형식
            const 결과저장배열 = 대상배열.sort((a,b) => {
                차순에 따른 비교 코드
            })

        */

        console.log(brands.sort()); // ['구글', '네이버', '삼성', '애플', '카카오', '하이닉스']
        console.log(brands); // ['구글', '네이버', '삼성', '애플', '카카오', '하이닉스'] 변경X

        let points = [98, 87, 67, 89, 100, 78];

        console.log(points.sort()); // [100, 67, 78, 87, 89, 98]
        console.log(points);

        const ascResult = points.sort((a, b) => {
            // 오름차순
            // if (a > b) return 1; // 양수 : 두 값의 자리를 바꿔라
            // else if (a < b) return -1; // 음수 : 자리를 바꾸지 않는다.
            // else return 0; // 0 : 자리를 바꾸지 않는다.
            return a - b;
        });
        console.log(ascResult); // [67, 78, 87, 89, 98, 100]

        const descResult = points.sort((a, b) => {
            // if (a < b) return 1;
            // else if (a > b) return -1;
            // else return 0;
            return b - a;
        });
        console.log(descResult); // [100, 98, 89, 87, 78, 67]

        let drinklist = [
            { name: "오렌지", price: 1000 },
            { name: "파워에이드", price: 1200 },
            { name: "커피", price: 700 },
            { name: "보리음료", price: 1200 },
            { name: "코카콜라", price: 1800 },
        ];

        // price로 오름차순 정렬
        // const ascDrinkList = drinklist.sort((a, b) => {
        //     return a.price - b.price;
        // })
        // console.log(ascDrinkList);

        // name 오름차순 정렬
        const ascDrinkList = drinklist.sort((a, b) => {
            if (a.name > b.name) return 1;
            else return -1;
        });
        console.log(ascDrinkList);

        // 기준을 입력받아서(name OR price) 오름차순으로 정렬
        // 왜 리턴 0은 안되는가?
        // 왜 둘 다 실행하는 것은 안되는가?

        const choiceSort = (arr, key) => {
            return arr.sort((a, b) => {
                if (a[key] > b[key]) return 1;
                else return -1;
            });
        };

        // let input = prompt("정렬 기준 (name / price)")
        // if (input === "name") {
        //     console.log(choiceSort(drinklist, "name"));
        // } else if (input === "price") {
        //     console.log(choiceSort(drinklist, "price"));
        // } else {
        //     console.log("존재하지 않는 기준입니다.");
        // }

        /*
            11. filter() : 배열에서 특정 조건을 만족하는 요소를 새로운 배열로 반환*********************
            - 원배열 변경X

            const 새로운결과배열 = 원배열.filter((매개변수) => { 조건 }); 
        */

        drinklist = [
            { name: "오렌지", price: 1000 },
            { name: "파워에이드", price: 1200 },
            { name: "커피", price: 700 },
            { name: "보리음료", price: 1200 },
            { name: "코카콜라", price: 1800 },
        ];

        //- for 문을 이용해 1000원으로 구입 가능한 음료 리턴

        let result = [];
        for (let i of drinklist) {
            if (i.price <= 1000) {
                result.push(i);
            }
        }
        console.log(result);
        console.log(drinklist); // 원 배열 변화X

        // - filter로
        const canByDrink = drinklist.filter((drink) => {
            return drink.price <= 1000;
        })
        console.log(canByDrink);

        /* 
            < 필터 활용 >
            - 사용자가 카테고리를 선택하고, 특정 가격 이하의 상품만 보겠다고 체크했을때 프론트엔드에서 데이터를 거르는
        */

        let products = [
            { id: 1, name: '맥북 프로', category: "electronics", price: 2500000 },
            { id: 2, name: '아이패드 에어', category: "electronics", price: 900000 },
            { id: 3, name: '기계식 키보드', category: "accessories", price: 150000 },
            { id: 4, name: '허브 매트', category: "accessories", price: 30000 },
        ];

        // 조건 1 : 악세사리인 것
        const accessoriesOnly = products.filter((item) => {
            return item.category === "accessories";
        });
        console.log(accessoriesOnly);

        // 조건 2 : 가격이 10만원 이하인 것
        const priceLimit = products.filter((item) => {
            return item.price <= 100000;
        });
        console.log(priceLimit);

        // 조건 3 : 악세서리 중 10만원 이하인 것
        const bothLimit = products.filter((item) => {
            return item.category === "accessories" && item.price <= 100000;
        });
        console.log(bothLimit);

        /*
            12. map() : 배열의 모든 요소를 이용해 모두 실행하고 새로운 배열을 생성**********************
            const 결과배열 = 원배열.map((매개변수) => { return ... });

        */

        let userList = [ // 일반적으로 성과 이름을 나누어 저장함
            { firstName: "재석", lastName: "유", email: "you@gmail.com" },
            { firstName: "종국", lastName: "김", email: "kim@gmail.com" },
            { firstName: "광수", lastName: "이", email: "lee@gmail.com" },
        ];

        let newUserList = userList.map((user) => {
            return {
                fullName: user.lastName.concat(user.firstName),
                email: user.email
            };
        });
        console.log(newUserList);

        // map()을 활용해 userList를 화면에 표로 나타내시오
        let userListTag = [];
        userList.map((user) => {
            userListTag.push(
                `<tr>
                    <td>${user.lastName}</td>
                    <td>${user.firstName}</td>
                    <td>${user.email}</td>
                </tr>`
            )
        });
        document.getElementById("userTbody").innerHTML = userListTag.join("");

        // map()을 활용해 let products를 화면에 표로 나타내시오.
        let productsTag = [];
        products.map((item) => {
            productsTag.push(
                `<tr>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.price}</td>
                </tr>`
            )
        });
        // document.getElementById("prodTbody").innerHTML = productsTag.join("");


        // 소수점 자리 표시해서 문자열로 표시하기

        // let newProd = products.map((item) => {
        //     let price = item.price.toString();
        //     for (let i = price.length; i > 0; i += 3) {
        //         price = price.splice(i, 0, ",");
        //     }
        // });
        // console.log(newProd);

        let newProdTag = [];
        products.map((item) => {
            newProdTag.push(
                `<div>
                    <h2>${item.name} : ${item.price}</h2>
                </div>`
            )
        });
        document.getElementById("prodTbody").innerHTML = newProdTag.join("");

        /*
            13. reduce() : 배열 요소의 누적 합을 구하는 함수
            p1 : accumulator => 누적 값
            p2 : currentValue => 현재 값
            p3 : currentIndex => 현재 배열 인덱스, 생략 가능
            p4 : arr => 전체 배열, 생략 가능


            형식 -
            배열.reduce((누적값, 현재값) => {
                return 다음 누산기에 넘겨줄 값 (sum += curr)
            }, 누적값 초기값)
        */

        points = [98, 87, 67, 89, 100, 78];
        const sumOfPoints = points.reduce((sum, point) => {
            return sum += point
        }, 0);
        console.log(sumOfPoints);

        drinklist = [
            { name: "오렌지", price: 1000 },
            { name: "파워에이드", price: 1200 },
            { name: "커피", price: 700 },
            { name: "보리음료", price: 1200 },
            { name: "코카콜라", price: 1800 },
        ];
        const sumOfPrice = drinklist.reduce((sum, drink) => {
            return sum += drink.price;
        }, 0);
        console.log(sumOfPrice);






    </script>
