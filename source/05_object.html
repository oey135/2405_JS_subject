<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. 데이터 타입 - Object</title>
</head>

<body>
    <script>
        /* 객체(object)
        - 파이썬의 딕셔너리와 유사
        - 관련있는 데이터를 하나로 담을 수 있는 자료 타입
        - {} 사용
        - {키(key):값(value), ...}
            - 파이썬-딕셔너리와의 차이점 : key는 **문자열**만 됌 (숫자X)
            - 키 : 고유한 값 -> 에러 발생X, 하지만 덮어쓰기됌
            - 값 : 문자, 숫자, 배열, 불리안, 객체, 함수, ... -> 제한X
        - 관리가 쉽다 -> 생성 후 수정, 추가, 삭제 등이 용이
        - 원래는 순서를 보장하지 않는다. -> ES6이후 보장 노력 (파이썬은 순서 보장X)

        1. 객체의 작성 : 관련있는 정보를 하나로 묶어서 사용하고 싶은 경우
        */
        let student = {
            name: "권초현",
            phone: "010-1111-2222",
            email: "hyn@gmail.com",
            address: "서울시 관악구",
        }
        console.log(student);
        console.log(typeof (student));


        let numbers = {
            1: "111",
            2: "222",
        };
        console.log(numbers);
        // 분명 숫자는 키가 안된다고 했다. 하지만 오류가 없다. 왜 일까??
        // -> 자동으로 문자열로 변환해준다.

        // 2. object의 키값을 읽어오는 메소드 : Object.keys(객체)
        let keys = Object.keys(numbers);
        console.log(keys); //반환 : 배열
        console.log(typeof (keys)); //배열도 오브젝트이다.
        console.log(keys[0]);

        // 3. 값(value)에 접근하는 방법 : 객체이름.키 (자바와 동일)
        let name = student.name;
        // 키 값과 동일해도 오류X - 키 'name'의 변수 스코프가 객체 내까지 이기 때문이다.
        // 변수 스코프(scope) : 변수가 영향을 미치는 범위 {}, 함수 내 선언
        // 일반적으로 키명과 동일하게 짓는다.

        let phone = student.phone;
        let email = student.email;
        let address = student.address;
        console.log(name, phone, email, address);

        // 4. 값을 수정하는 방법
        student.phone = "010-2222-3333";
        console.log(student.phone);

        //5. 객체에 새로운 키와 값을 추가하고자 하는 경우
        student.bloodType = "AB";
        console.log(student);

        // 6. 중요!!!! 특정 키에 접근하는 방법
        // 접근하려는 키가 정해져있는 경우 
        console.log(student.name);

        // 만약 접근하고자 하는 특정 키가 정해져있지 않은 경우라면?
        console.log(student["name"]);

        // 활용
        let userInput = prompt("알고 싶은 것은 무엇인가요?(name, phone, email, address, bloodType)");
        console.log(student[userInput]);

        // 7. 정의되지 않은 키 값에 접근하고자 할 경우 -> **undefined** (시험!!!)

    </script>
</body>

</html>
