<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>23. math 객체 내장 함수</title>
    </head>

    <body>
        <script>
            // Math 객체
            // new Set(), new Map()
            // Math.ceil() <= new로 만들지 않고 사용!

            // 1. round() : 반올림 처리 -> 실무에서 자주 사용
            console.log(Math.round(2.4)); // 2
            console.log(Math.round(2.9)); // 3

            // 2. ceil() : 올림처리 -> 실무에서 자주 사용(페이징)
            console.log(Math.ceil(2.4)); // 3
            console.log(Math.ceil(2.9)); // 3

            // 페이징 처리 ex) 게시판 글 10개씩.. total 53개 가정. 페이지는 6페이지 필요
            let total = 53;
            let countPage = 10;
            let totalPage = Math.ceil(total / countPage); // 6
            console.log("필요한 페이지 수 : " + totalPage);

            // 3. floor() : 내림 처리
            console.log(Math.floor(2.4)); // 2
            console.log(Math.floor(2.9)); // 2
            console.log(Math.floor(-2.4)); // -3
            console.log(Math.floor(-2.9)); // -3

            // 4. trunc() : 소수점 이하는 무조건 버림
            console.log(Math.trunc(2.4)); // 2
            console.log(Math.trunc(2.9)); // 2
            console.log(Math.trunc(-2.4)); // -2
            console.log(Math.trunc(-2.9)); // -2

            // **floor() vs trunc()** : 음수 일 때 floor은 숫자가 더 작아짐, trunc는 그냥 자름

            // 5. sign() : 양수면 1, 음수면 -1, 0 -> 거의 사용 안함
            console.log(Math.sign(2.4)); // 1
            console.log(Math.sign(0)); // 0
            console.log(Math.sign(-2.4)); // -1

            // 6. pow() : 제곱값
            console.log(Math.pow(2, 4)); // 16
            console.log(Math.pow(-2, 3)); // 27

            // 7. sqrt() : 제곱근값
            console.log(Math.sqrt(64)); // 8
            console.log(Math.sqrt(-1)); // NaN

            // 8. abs() : 절댓값
            console.log(Math.abs(64)); // 64
            console.log(Math.abs(-1)); // 1

            // 9. min() - 최소값, 파라미터 개수제한 X
            console.log(Math.min(6, 3, 4, -9, 5.6, 12)); // -9
            console.log(Math.min(-9, 5.6, 12)); // -9

            // 10. max() : 최댓값, 파라미터 개수제한 X
            console.log(Math.max(6, 3, 4, -9, 5.6, 12)); // 12
            console.log(Math.max(-9, 5.6, 12)); // 12

            // 11. random() - 0~0.999.. 난수 발생 -> 실무에서 자주 사용
            console.log(Math.random());

            //활용1. 0~9
            console.log(Math.trunc(Math.random() * 10));

            //활용2. 1~10
            console.log(Math.trunc(Math.random() * 10) + 1);

            //활용3. 1~100
            console.log(Math.trunc(Math.random() * 100) + 1);

            //활용4. 시작값과 종료값을 주면 사이값을 random하게 나오게 하는 함수를 작성하여 활용해보자
            const getRandomInt = (min, max) => {
                //3, 76
                let size = max + "".length;
                return Math.trunc(Math.random() * (max - min + 1) + min);
            };
            console.log(getRandomInt(3, 76));
        </script>
    </body>
</html>
