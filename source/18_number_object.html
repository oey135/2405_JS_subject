<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18. Number 객체 내장 함수</title>
    <style>
        .name {
            width: 200px;
        }
    </style>
</head>

<body>

    <label for="n1" class="name">숫자 1 </label> <!-- 시각 보조 시스템으로 활용 -->
    <input type="number" id="n1"><br>

    <label for="n2" class="name">숫자 2 </label>
    <input type="number" id="n2">

    <button onclick="doSum()">연산</button><br>

    <div>
        결과 : <span id="result"></span>
    </div>



    <script>

        const doSum = () => {
            let num1 = parseInt(document.getElementById("n1").value); // 브라우저에 따라 문자열로 넘어옴
            console.log(num1);

            let num2 = parseInt(document.getElementById("n2").value); // 브라우저에 따라 문자열로 넘어옴
            console.log(num2);

            let sum = num1 + num2;
            document.getElementById("result").innerHTML = sum; // 결과가 숫자 혹은 문자일 때에는 innerText가능
        }

        // Number 객체의 내장함수

        let num = 123;
        let strNum = "456";

        console.log(num);
        console.log(strNum);

        // 1. toString() : 숫자를 문자열로 변환
        console.log(num.toString());


        // 2. toFixed() : 소수점 이하 몇자리까지 보여줄지를 결정 -> 실무에서 많이 사용, 문자열로 저장
        // 다음 소수점 자리를 반올림함

        num = 10.4567;
        console.log(num.toFixed(0)); //10
        console.log(num.toFixed(1)); //10.5
        console.log(num.toFixed(2)); //10.46
        console.log(num.toFixed(3)); //10.457
        console.log(num.toFixed(4)); //10.4567

        // 3. toExponntial() : 지수표기법으로 표현, 문자열로 저장
        // 실무에서 잘 안씀

        console.log(num.toExponential(2));

        // 4.toPrecision() : 소수점 포함 몇자리까지 보여줄지를 결정, 문자열로 저장
        // 실무에서 잘 안씀

        console.log(num.toPrecision(4)); //10.46

        // **parseInt() : 문자를 정수로 변환, 전역함수(주인 = window),
        // num.toFixed() vs **(window.)parseInt(num)**

        console.log(parseInt(num));

        // **parseFloat() : 문자를 실수로 변환, 전역 함수 (주인 = window)
        strNum = "123.456";
        console.log(strNum);
        console.log(parseFloat(strNum));

    </script>
</body>

</html>
