<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31. 배열 전개 연산자</title>
</head>

<body>
    <script>

        // spread operator : ... => 실무에서 정말 많이 사용한다.
        // 1. concat
        let arr1 = [1, 2, 3];
        let arr2 = [4, 5, 6];
        let arr3 = [7, 8, 9];
        let arr4 = [...arr1, ...arr2, ...arr3];
        console.log(arr4);

        // 2. rest parameter
        const sum5 = (...nums) => {
            let sum = 0;
            for (const n of nums) {
                sum += n;
            }
            return sum;
        }
        console.log(sum5(1, 2, 3, 4, 5)); //15

        // 3. 복사
        let target = ["a", "b", "c"];
        let result = [...target];
        console.log(target);
        console.log(result);
        console.log(target === result); // 참조값 !=, 따라서 얕은 복사

        // 4. 형변환
        let foodSet = new Set();
        foodSet.add("햄버거");
        foodSet.add("고기");
        foodSet.add("피자");
        foodSet.add("라면");
        foodSet.add("파스타");

        console.log(foodSet);
        console.log([...foodSet]); // 배열로 형변환








    </script>
</body>

</html>
