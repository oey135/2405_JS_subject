<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>33. xml http request</title>
</head>

<body>
    <script>

        /*
            Promise 개념 등장 -> 비동기 통신에서 서버로부터 응답이 왔을 때
            호출한 함수에서 알 수 있게 약속해주는 함수이며, 결과를 리턴(받는 부분까지는 재활용 가능) 받은 후
            결과를 나타내는 부분을 각각 작성하면 되므로 재활용이 쉬워진다.

            - 응답 지연과 렌더링(완전 재활용)문제 해결을 위함
        */
        const url = "http://localhost:3000/";

        const getData = (target) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url + target);
                xhr.setRequestHeader("content-type", "application/json");
                xhr.send();
                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.response);
                        resolve(result); // 성공 시
                    } else {
                        reject(xhr.status) // 실패 시
                        console.log(xhr.status, xhr.statusText);
                    }
                };
            });
        };

        // promise 실행
        getData("posts").then(
            (result) => {
                console.log(result);
            }, (error) => {
                console.error(xhr.status);
            });

        // 2. 생성  : POST, 201
        const postData = (target) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest(); // 객체 생성
                xhr.open("POST", url + target); // 준비
                // 컨텐트 타입 (:charset=UTF-8)
                xhr.setRequestHeader("content-type", "application/json:charset=UTF-8"); // 컨텐트 타입

                const newData = { id: 3, title: "Kwonch", views: 300 };

                // 생성할 데이터 -> json으로 변환
                xhr.send(JSON.stringify(newData)); // 요청
                xhr.onload = () => {
                    // 응답 오면 실행할 함수
                    if (xhr.status === 201) {
                        // 성공시 출력
                        const result = JSON.parse(xhr.response); // json 문자열로 응답옴
                        resolve(result);
                    } else {
                        reject(xhr.status, xhr.statusText);
                    }
                };
            });

        };

        // promise 실행
        postData("posts").then(
            (result) => {
                console.log(result);
            }, (error) => {
                console.error(xhr.status);
            });

        // 3. 수정  : PUT, 200
        const putData = (targetId) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest(); // 객체 생성
                xhr.open("PUT", url + targetId); // 준비
                // 컨텐트 타입 (:charset=UTF-8)
                xhr.setRequestHeader("content-type", "application/json:charset=UTF-8"); // 컨텐트 타입

                const updateData = { title: "Kwonch", views: 1000 };

                // 수정할 데이터 -> json으로 변환
                xhr.send(JSON.stringify(updateData)); // 요청
                xhr.onload = () => {
                    // 응답 오면 실행할 함수
                    if (xhr.status === 200) {
                        // 성공시 출력
                        const result = JSON.parse(xhr.response); // json 문자열로 응답옴
                        resolve(result);
                    } else {
                        reject(xhr.status, xhr.statusText);
                    }
                };
            })
        };

        // promise 실행
        putData("posts/k1lW-wAgSLY").then((result) => {
            console.log(result);
        }, (error) => {
            console.error(xhr.status);
        });

        // 4. 삭제  : DELETE, 200
        const deleteData = (targetId) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest(); // 객체 생성
                xhr.open("DELETE", url + targetId); // 준비
                // 컨텐트 타입 (:charset=UTF-8)
                xhr.setRequestHeader("content-type", "application/json:charset=UTF-8"); // 컨텐트 타입

                // 수정할 데이터 -> json으로 변환
                xhr.send(); // 요청
                xhr.onload = () => {
                    // 응답 오면 실행할 함수
                    if (xhr.status === 200) {
                        // 성공시 출력
                        const result = JSON.parse(xhr.response); // json 문자열로 응답옴
                        console.log(result);
                    } else {
                        console.log(xhr.status, xhr.statusText);
                    }
                };
            })

        };

        // promise 실행
        deleteData("posts/").then((result) => {
            console.log(result);
        }, (error) => {
            console.error(xhr.status);
        });

    </script>
</body>

</html>
