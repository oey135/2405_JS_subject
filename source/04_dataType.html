<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5. 기본 데이터 타입</title>
</head>

<body>
    <script>
        //1. 문자열(String) : "" '' -> 팀이 결정(프젝 시 문자 " 혹은 '이 필요할 경우 )

        let name1 = "Mirim";
        let name2 = "Mirim";
        console.log(name1.length);

        let str1 = "그는 '존'이라고 합니다. ";
        console.log(str1);

        let str2 = '그는 "존"이라고 합니다.';
        console.log(str2);

        let str3 = '그는 "존"이라고 합니다.'; // \+문자 : 이스케이프 문자(Escape Character)
        console.log(str3);

        //연산 : + (concate)
        let firstName = "John";
        let lastName = "Bacon";
        let fullName = firstName + lastName;
        console.log(fullName);

        /*
              2. 숫자(Number)
              - 정수, 실수 다 표현
              - 다양한 속성(property)과 함수(method)지원
              - 64비트 부동소수점 방식 이용해서 표현 -> 정밀도 오차
              -  
              
              * 숫자(실수) : 64비트 부동소수점 방식
              - 맨 앞 1자리로 부호 표현 : 0-양수 1-음수
              - 지수부 (11자리)
              - 가수부 (소수부, 52자리)
              
              ex) 123.53 = 0.12353(가수) * 10^3(지수)
              - 가수부분을 2진수로 변환 후 가수부에 오른쪽부터 넣고 남은 자리는 0으로 채움
              - 지수부는 127(= 0승 기준: 바이어스 방식)+지수, 127+3=130
          */

        console.log(Number.MAX_SAFE_INTEGER);
        console.log(Number.MAX_VALUE);

        let a = 3;
        let b = 3.67;
        console.log(a, b);

        /* 
              정밀도 오차 (굉장히 크거나 작은 숫자를 다룰 때, 혹은 정밀도를 요구할 때 신경쓰기)
              1. 정수로 변환 : (0.1*10+0.2*10)/10)
              2. 출력 시점에 toFixed(자릿수) : 소수점 이하 자리를 잘라줌
                  (0.1+0.2).toFixed(1); - 문자열로 출력됌
              3. 다양한 오픈 라이브러리 사용 (BigNumbers.js가 가장 많이 쓰임)
          */
        let result = 0.1 + 0.2;
        if (result === 0.3) {
            console.log("정답");
        } else {
            console.log("오답" + result);
        }

        console.log((0.1 + 0.2).toFixed(1)); //1
        console.log((0.1 * 10 + 0.2 * 10) / 10); //2

        //3. Boolean (참, 거짓)

        let inputAge = 17;
        let adultAge = 20;
        let isAdult = inputAge >= adultAge;
        console.log(isAdult);
        /* 자바스크립트에서 거짓(false)에 해당하는 값 :
          false, 0, "", undefined, null, NaN(Not a number) - 이 외의 것은 전부 참*/
        let userInput = prompt("이름 : ");
        if (!userInput) {
            console.log("hello");
        }

        /*
              **undefined** (중요)
              - 데이터 타입이자 데이터 값
              - 개발자 실수 : 선언은 하는데, 할당을 안 한 경우
              - 실행시간에 브라우저 엔진이 undefined 할당 -> 전체 stop 방지
              - 정의되지 않은, 할당하지 않은
          */

        let x;
        console.log(x);

        /*
              5. null
              - 없음을 의미
              - 개발자가 의도적으로 할당
              - 변수를 선언하는 시점에 데이터 타입이나 값을 결정하지 못한 경우
              - garbage collection : 
              메모리 효율을 위해 더 이상 사용하지 않는 메모리를 해제 시
          */
        let y = "굉장히 큰 json데이터";
        y = null;
    </script>
</body>

</html>
