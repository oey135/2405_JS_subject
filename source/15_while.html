<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15. while</title>
</head>

<body>
    <script>
        //1. while : 조건이 참인 동안 반복, 무한루프 조심
        let i = 0;
        while (i < 10) {
            console.log(i);
            i++;
        }
        console.log("i : " + i); //10


        //2. do-while : 무조건 한 번 실행
        do {
            console.log("do while : " + i);
            i++;
        } while (i < 10);
        console.log("i : " + i); // 11

        /*
        동전 교환기 코드
        7900원 입력, 500원짜리로 교환 -> 결과 15개, 거스름돈 400원
        8000원 입력, 500원짜리로 교환 -> 결과 16개, 거스름돈 0원
        */

        let inputCoin = 8000; // 투입액
        let coinUnit = 500; // 단위 코인
        let coinCount = 0; // 교환해줄 동전의 개수

        while (inputCoin >= coinUnit) {
            inputCoin -= coinUnit;
            coinCount++;
        }
        console.log("결과 : " + coinCount + "개, 거스름돈 " + inputCoin + "원");


    </script>
</body>

</html>
