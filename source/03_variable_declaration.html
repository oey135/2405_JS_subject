<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. 변수 선언자</title>
    <script>
        /*
            변수 선언 : var(전역 변수. 사용 시 조심!!), let, const

            1. var :
            - ES6 이전부터 사용한 선언자
            - 재선언(동일한 이름으로 재선언이 가능). 재할당 가능
            - 재선언이 가능한 변수 -> 협업을 하면서 동일한 이름의 변수를 var로 선언할 경우 덮어쓰기가 가능해서 예상하지 않은 결과가 나올 수 있다.
            - 전역 변수로 사용 가능
            - 덮어쓰기 가능 -> 오류 발생 가능성 -> 조심
        */
        var name = "2학년 4반";
        console.log(name);

        var x = 5;
        var y = 7;
        var z = x + y;
        console.log("z1 : ", z);

        x = 9; //재할당
        z = x + y;
        console.log("z2 : ", z);

        var x = 12; //셋 다 재선언
        var y = 17;
        var z = x - y;
        console.log("z3 : ", z);

        /*
            2. let :
            - ES6 이후에 등장
            - 재선언 불가 -> 동일한 변수명 사용 불가 -> 권장
            - 재할당 가능
       */

        let x1 = 9;
        let y1 = 10;
        let z1 = x1 + y1;
        console.log("z1 : ", z1);

        //재선언 불가
        //let x1 = 6; //Uncaught SyntaxError: Identifier 'x1' has already been declared

        x1 = 13; //재할당 가능
        y1 = 17;
        z1 = x1 - y1;
        console.log("z1 : ", z1);

        /*
            3. const : 
            - es6부터
            - 상수값(변하지 않음) ex. 프젝의 날짜 표시 형식 지정 : YYYY-MM-DD
            - 대문자로 선언 (가급적)
            - 재선언, 재할당 불가 (재할당 시 예외 발생)
            - 협업 -> 팀 -> 포맷 지정 시 활용
            ex) const dateFormat = 'YYYY.MM.DD';
        */

        const PI = 3.14;
        console.log("PI : ", PI);
        PI = 3; //Uncaught TypeError: Assignment(할당) to constant variable.

    </script>
</head>

<body>

</body>

</html>
