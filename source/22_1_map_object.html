<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>22. map 활용</title>
    </head>

    <body>
        <script>
            /*
                개발자들은 왜 일반 객체 대신 map을 쓸까?
                1. 개수 구하기 쉬움
                2. 자료를 추가하고 삭제하는 속도가 빠름
                3. key에 무엇이든 올 수 있음
            
            */

            /*
                실무 예제 : 온라인 쇼핑몰 장바구니 관리
                쇼핑몰 웹사이트를 만들 때 장바구니는 아래 기느이 반드시 필요합니다.

                1. 상품 담기 (추가)
                2. 이미 담긴 상품인지 확인하고 수량 늘리기 (조회 및 수정)
                3. 상품 빼기 (삭제)
                4. 장바구니에 총 몇 종류의 상품이 있는 지 확인(개수 파악)

            */

            let myCart = new Map();

            // 사려고 카트에 담아둔 물건들
            myCart.set("product_01", {
                name: "마우스",
                price: 100000,
                quantity: 5,
            });
            myCart.set("product_02", {
                name: "공인 축구공",
                price: 200000,
                quantity: 1,
            });

            // 2. 이미 담긴 상품인지 확인하고 수량 늘리기
            const userInput = "product_01";

            const addProduct = (userInput) => {
                if (myCart.has(userInput)) {
                    const choice = prompt(
                        "이미 있는 상품 입니다. 수량을 추가할까요? (y/n)",
                    );
                    if (choice === "y") {
                        myCart.get(userInput)["quantity"]++;
                        console.log(
                            `수량 추가 완료, 현재 ${myCart.get(userInput)["name"]} 개수 : ${myCart.get(userInput)["quantity"]}`,
                        );
                    } else {
                        console.log("수량 추가 취소");
                    }
                } else {
                    alert("장바구니에 추가되었습니다.");
                }
            };
            addProduct(userInput);

            // 현재 장바구니에 들어있는 item과 총 개수

            const showCart = (cart) => {
                let total = 0;
                cart.forEach((v, k) => {
                    console.log(v);
                    total += v["price"] * v["quantity"];
                });
                console.log(`총 장바구니 상품 금액 : ${total}`);
            };
            showCart(myCart);
        </script>
    </body>
</html>
