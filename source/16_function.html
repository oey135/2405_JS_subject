<body>
    <script src="./js/common.js"></script>
    <script>
        /*
            1. 함수 선언식 방식
            function 함수명(매개변수...) { //매개변수의 개수와 타입은 상관 없다.
                ...(return ...)
            }
        */
        console.log(sum(4, 5)); // 선언 전 호출 가능
        // function sum(n1, n2) {
        //     return n1 + n2;
        // }
        console.log(sum(4, 3)); // 선언 후도 가능


        console.log(taxAmount(56700));

        var b = 0; //전역 변수

        //팀작업?? common.js, src="경로"로 연결, 링크만 걸어두면 함수 변경시에도 자동 적용

        /*
            2. 함수 표현 방식
            - 변수명에 함수를 할당해서 사용, 선언 전 호출 불가능

        */

        const sum2 = function (n1, n2) { // const로 선언 : 함수 덮어씌워짐 방지
            return n1 + n2;
        };
        console.log("sum2 : " + sum2(6, 9));

        /*
            3. 화살표 함수 : 실무에서 가장 많이 사용
            - 선언 전 호출 불가
            - 화살표 함수로 변경하는 법
                1. function 예약어 삭제
                2. 변수에 할당
                3. ( 매개변수..) => {...}
                4. return 문이 있고 코드가 한 줄인 경우 {}, return 생략가능
        */
        const sum3 = (n1, n2) => n1 + n2;
        console.log("sum3 : " + sum3(1, 2));

        /*
            4. Function() 생성자 함수
            String(num) - string 객체
            String() - 생성자 함수

            Student s1 = new Student();
            - Student : 클래스 명
            - s1 : 인스턴스 객체 명
            - new : 메모리 할당 에약어
            - Studnet() : 생성자 함수!!
            
            활용 예제
            숫자 2개, 연산자를 입력받아 해당 연산을 실행하는 함수를 작성해보자.
            함수는 3가지 중 선택

            함수명 : calculator
        */

        function calculator(n1, n2, operator) {
            switch (operator) {
                case '+': return n1 + n2;
                case '-': return n1 - n2;
                case '*': return n1 * n2;
                case '/': return n1 / n2;
                case '%': return n1 % n2;
            }
        }
        console.log("계산 결과 : " + calculator(12, 6, "%"));

        const add = new Function("n1", "n2", "return n1+n2"); //맨 뒤 매개변수는 실행코드로 약속 돼있다.
        console.log(add(7, 8));

        const op = "%";
        const calculator2 = new Function("n1", "n2", "return n1" + op + "n2");
        console.log(calculator2(12, 6));



    </script>
</body>

</html>
