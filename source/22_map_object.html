<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22. map</title>
</head>

<body>
    <script>
        console.log("===set으로 해보기===");

        let oPerson = {};
        oPerson.name = "권초현";
        oPerson.address = "신림동";
        oPerson.email = "kwon@gmail.com";
        oPerson["170"] = 49;

        let c = 0;
        for (const key in oPerson) {
            c++;
            console.log(`${key} : ${oPerson[key]}`);
        }
        console.log(`총 요소 개수 : ${c}`);


        // 1. map생성
        let personMap = new Map();

        // 2. set() : 요소 추가
        personMap.set("name", "권초현");
        personMap.set("address", "신림동");
        personMap.set("email", "kwon@gamil.com");
        personMap.set(170, 49);

        personMap.forEach((v, k) => {
            console.log(`${k} : ${v}`);
        })

        // 3. size 속성 : 요소 개수
        console.log("총 요소 개수 : " + personMap.size);

        // 4. keys() : 키 값만 골라내기
        for (let key of personMap.keys()) {
            console.log(key);
        }

        // 5. values() : 값만 골라내기
        for (let value of personMap.values()) {
            console.log(value);
        }

        // 7. has() : 키의 존재여부 => true, false
        console.log(personMap.has("phone")); //false
        console.log(personMap.has("adress")); //true

        // 8. delete() : 해당 요소를 삭제
        personMap.delete("name");
        console.log(`총 요소 개수 : ${personMap.size}`);

        // 9. clear() : 모든 요소를 삭제
        personMap.clear();
        console.log(personMap.size);







    </script>
</body>

</html>
